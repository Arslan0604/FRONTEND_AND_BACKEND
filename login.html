<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 font-sans antialised">
    <!-- Navbar-->
    <nav class="bg-blue-600 p-4 text-white flex justify-between">
      <div>
        <h1 class="text-3xl font-bold">AI Blog Generator</h1>
      </div>
      <div>
        <a href="#" class="text-white hover:underline">Logout</a>
        <a href="#" class="text-white hover:underline">Singup</a>
      </div>
    </nav>

    <!-- Main content -->
    <div class="flex items-center justify-center h-screen">
      <div class="bg-white p-8 shadow-md rounded-lg max-w-md w-full">
        <!-- Login form -->
        <form class="space-y-4">
          <h2 class="text-xl font-semibold">Login</h2>
          <div>
            <lebal for="Username" class="block md-1 font-medium">
              Username
            </lebal>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username..."
              class="w-full p-2 border rounded-lg"
            />
          </div>
          <div>
            <lebal for="Password" class="block md-1 font-medium">
              Password
            </lebal>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your Password..."
              class="w-full p-2 border rounded-lg"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
